<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nephron atlas: renal circulation and transport</title>
<style>
:root{
  --bg:#E6ECEF;--panel:#F8FAFB;--panel2:#EDF2F4;--ink:#15253B;--ink2:#46586D;--ink3:#7A8A9C;--line:#C9D4DC;
  --accent:#0E6E72;--accentInk:#fff;--art:#C2333E;--ven:#3E6BB0;--up:#0E6E72;--dn:#B26A06;--bad:#C2333E;--good:#1F8A55;--chip:#fff;
  --lumen:#FBF3E3;--cell:#F3E6D8;--cellEdge:#B98A5E;--inter:#F4DCD8;--cap:#F1C9CB;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:"Avenir Next","Segoe UI","Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1722;--panel:#15212E;--panel2:#1B2938;--ink:#E2E9F0;--ink2:#A3B2C2;--ink3:#7A8B9E;--line:#2A3A4D;
  --accent:#4EBFB9;--accentInk:#0E1722;--art:#E65E67;--ven:#76A0E4;--up:#4EBFB9;--dn:#E9A640;--bad:#EF6670;--good:#4CC287;--chip:#1D2B3B;
  --lumen:#2A2A25;--cell:#33291F;--cellEdge:#8A6845;--inter:#3A2830;--cap:#4E2A30;color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;letter-spacing:.1px;margin:0}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand h1{font-size:23px;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--ink2);font-size:13px}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.controls label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2)}
select{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:330px}
button{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13.5px}
button:hover{border-color:var(--accent)}
button.on,button.primary{background:var(--accent);color:var(--accentInk);border-color:var(--accent)}
input[type=range]{accent-color:var(--accent)}
main.layout{display:grid;grid-template-columns:minmax(300px,min(47vw,calc((100vh - 70px) * .78))) minmax(0,1fr);align-items:start}
.plate{position:sticky;top:0;max-height:100vh;overflow:auto;padding:10px 14px 24px;border-right:1px solid var(--line);scrollbar-width:thin}
.legend{display:flex;flex-wrap:wrap;gap:4px 6px;margin:0 0 6px}
.legend button{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 6px;border-radius:999px;font-size:12px}
.legend button[aria-pressed=false]{opacity:.42}
.legend svg{width:12px;height:12px}
.stage{position:relative;width:100%;aspect-ratio:640/800;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.stage>svg,.stage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage>canvas{pointer-events:none}
.hit{fill:none;stroke:transparent;stroke-width:20;cursor:pointer;pointer-events:stroke}
.hitA{fill:transparent;cursor:pointer}
.seg-hl{opacity:0;transition:opacity .15s}
.seg-hl.show{opacity:.6}
.seg-hl.sel{opacity:.5}
.seg-hl.sel.show{opacity:.75}
.ovlab{font:600 10.5px var(--sans);fill:var(--ink);paint-order:stroke;stroke:var(--panel);stroke-width:3px;pointer-events:none}
.zonelab{font:600 12px var(--serif);fill:var(--ink);opacity:.8;pointer-events:none}
.osmlab{font:11px var(--sans);fill:var(--ink2);pointer-events:none}
.chipT{font:600 9.5px var(--sans);fill:var(--ink);pointer-events:none}
.badgeT{font:600 9.5px var(--sans);pointer-events:none}
.tip{position:absolute;z-index:5;pointer-events:none;max-width:290px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4;box-shadow:0 8px 28px rgba(0,0,0,.18);opacity:0;transition:opacity .12s}
.tip b{font-family:var(--serif);font-size:14px;display:block;margin-bottom:2px}
.tip.show{opacity:1}
.hint{font-size:12px;color:var(--ink3);margin:6px 2px 0}
.readout{margin-top:12px}
.readout h3{font-size:17px;margin:4px 0 4px}
.readout .sum{font-size:13px;color:var(--ink2);margin:0 0 8px}
.kv{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:6px 0 10px}
.kv div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:11.5px;color:var(--ink2)}
.kv b{display:block;font-size:14px;color:var(--ink);font-variant-numeric:tabular-nums}
.labs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.labs table{width:100%;border-collapse:collapse;font-size:12.5px}
.labs caption{text-align:left;font:600 13px var(--serif);padding:2px 0}
.labs td{padding:2px 4px;border-top:1px solid var(--line);vertical-align:top}
.labs td:first-child{color:var(--ink2);white-space:nowrap}
.ar{font-weight:700;white-space:nowrap}
.ar.u{color:var(--up)}.ar.d{color:var(--dn)}.ar.n{color:var(--ink3)}
.fe{margin:10px 0}
.fe .row{display:grid;grid-template-columns:54px 1fr 50px;gap:6px;align-items:center;font-size:12px}
.fe .bar{height:7px;background:var(--panel2);border-radius:4px;overflow:hidden}
.fe .bar i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .4s}
ol.chain{margin:6px 0;padding-left:20px;font-size:13px}
ol.chain li{margin:3px 0}
ul.tf{margin:4px 0;padding-left:18px;font-size:13px}
.detail{padding:16px 26px 70px;min-width:0}
.detail h2{font-size:27px;line-height:1.15}
.detail .sub{color:var(--ink2);margin:4px 0 12px;max-width:75ch}
.detail h3{font-size:19px;margin:18px 0 6px}
.detail h4{font-size:15px;margin:12px 0 4px}
.detail p,.detail li{max-width:76ch}
.crumbs{font-size:12.5px;color:var(--ink3);margin-bottom:6px}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;text-decoration:underline;text-underline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 12px}
.tabs button{border:0;border-radius:8px 8px 0 0;background:none;padding:7px 12px;color:var(--ink2);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.cellstage{position:relative;width:100%;aspect-ratio:600/380;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.cellstage.tall{aspect-ratio:600/440}
.cellstage>svg,.cellstage>canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cellstage>canvas{pointer-events:none}
.tp{cursor:pointer}
.tp rect,.tp circle{transition:stroke-width .1s}
.tp:hover rect,.tp:hover circle,.tp.sel rect,.tp.sel circle{stroke:var(--ink);stroke-width:2}
.tpT{font:700 9.5px var(--sans);fill:#fff;pointer-events:none}
.cellT{font:600 11px var(--sans);fill:var(--ink2);pointer-events:none}
.cellH{font:600 13px var(--serif);fill:var(--ink);pointer-events:none}
.info{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin:10px 0;font-size:14px}
.info h4{margin:0 0 4px}
.info .meta{font-size:13px;color:var(--ink2);margin-top:4px}
.info .meta b{color:var(--ink)}
.scnbox{background:var(--panel);border:1px solid var(--bad);border-radius:10px;padding:10px 14px;margin:12px 0}
.scnbox h4{margin:0 0 4px;color:var(--bad)}
.eq{font-family:var(--serif);font-size:17px;background:var(--panel2);border-radius:8px;padding:8px 12px;margin:8px 0;display:inline-block;min-width:min(100%,360px)}
.eq small{font-family:var(--sans);font-size:12px;color:var(--ink2);display:block}
dl.vars{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px;margin:6px 0 12px;max-width:76ch}
dl.vars dt{font-family:var(--serif);font-weight:600}
dl.vars dd{margin:0;color:var(--ink2)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;margin:10px 0}
.ctrls label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13px;color:var(--ink2)}
.ctrls label input[type=range]{grid-column:1/-1;width:100%}
.ctrls output{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:600}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.outs{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:6px;margin:10px 0}
.outs div{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:6px 8px;font-size:12px;color:var(--ink2)}
.outs b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 0;font-size:13.5px}
.flow span.n{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.flow span.a{color:var(--ink3)}
.pw{width:100%;height:auto;display:block;margin:6px 0 4px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.pwT{font:12px var(--sans);fill:var(--ink);pointer-events:none}
.pwlegend{font-size:12px;color:var(--ink3);margin:0 0 10px}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0;max-width:820px}
table.tbl th,table.tbl td{border-top:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.tbl th{font-family:var(--serif);font-weight:600;background:var(--panel2)}
.chart{width:100%;height:auto;display:block;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.chT{font:11px var(--sans);fill:var(--ink2)}
.seg-btns{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.note{font-size:12.5px;color:var(--ink3)}
.calc{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.calc label{font-size:12.5px;color:var(--ink2);display:flex;flex-direction:column;gap:2px}
.calc input{background:var(--chip);border:1px solid var(--line);border-radius:7px;padding:5px 7px;width:100%}
.seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg-toggle button{border:0;border-radius:0;border-right:1px solid var(--line)}
.seg-toggle button:last-child{border-right:0}
@media (max-width:920px){main.layout{grid-template-columns:1fr}.plate{position:relative;max-height:none;border-right:0;border-bottom:1px solid var(--line)}.stage{max-width:560px;margin:0 auto}.detail{padding:14px 14px 60px}.kv{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>Nephron atlas</h1><p>Renal circulation, autoregulation and tubular transport, live</p></div>
  <div class="controls">
    <label for="scn">Simulate</label>
    <select id="scn" aria-label="Choose a scenario to simulate"></select>
    <button id="resetBtn" title="Return to normal physiology">Reset to normal</button>
    <button id="playBtn" aria-pressed="true">Pause</button>
    <label>Speed <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="Animation speed"></label>
  </div>
</header>
<main class="layout">
  <section class="plate" aria-label="Nephron overview">
    <div class="legend" id="legend" aria-label="Show or hide solutes"></div>
    <div class="stage" id="ovStage">
      <svg id="ov" viewBox="0 0 640 800" role="img" aria-label="Schematic juxtamedullary nephron with its blood supply"></svg>
      <canvas id="ovCanvas" aria-hidden="true"></canvas>
      <div class="tip" id="tip" role="status"></div>
    </div>
    <p class="hint">Hover a segment for a summary; click it for cells, channels and hemodynamics. Drawn as a long-looped juxtamedullary nephron; arrows and particle counts are schematic, not to scale.</p>
    <div class="readout" id="readout" aria-live="polite"></div>
  </section>
  <section class="detail" id="detail" aria-live="polite"></section>
</main>
<script>
"use strict";
/* ============================== utilities ============================== */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const isDark=()=>matchMedia('(prefers-color-scheme: dark)').matches;
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mix(a,b,t){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const c=(s)=>Math.round(lerp(A>>s&255,B>>s&255,t));return'#'+((1<<24)|(c(16)<<16)|(c(8)<<8)|c(0)).toString(16).slice(1);}
function osmColor(o){const t=clamp((o-280)/920,0,1);return isDark()?mix('#33262F','#8E2F3E',t):mix('#F8E7E3','#B14F58',t);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function arrowOf(s){if(!s)return'n';const c=s.trim()[0];return c==='↑'?'u':c==='↓'?'d':'n';}
function fmt(v,d=0){return Number.isFinite(v)?v.toFixed(d):'–';}

/* ============================== solutes ============================== */
const IONS={
  Na:{n:'Na⁺',c:'#EDB91E',sh:'c',r:3.2},
  K:{n:'K⁺',c:'#9466E8',sh:'c',r:3.2},
  Cl:{n:'Cl⁻',c:'#2DB86C',sh:'d',r:3.3},
  Ca:{n:'Ca²⁺',c:'#EE5F9C',sh:'c',r:3.4,ring:1},
  Mg:{n:'Mg²⁺',c:'#FF8833',sh:'c',r:3.1,ring:1},
  Glu:{n:'Glucose',c:'#E0442F',sh:'h',r:3.8},
  HCO3:{n:'HCO₃⁻',c:'#13AFC4',sh:'d',r:3.3},
  H:{n:'H⁺',c:'#C71B3A',sh:'t',r:3.4},
  H2O:{n:'H₂O',c:'#4A8FE3',sh:'w',r:2.5},
  OA:{n:'Organic anions (PAH, drugs)',c:'#9C7550',sh:'s',r:3},
  Pi:{n:'Phosphate',c:'#5A68C4',sh:'s',r:2.9},
  AA:{n:'Amino acids',c:'#8FBF2E',sh:'s',r:2.9},
  Urea:{n:'Urea',c:'#8792A6',sh:'t',r:3.1},
  Urate:{n:'Urate',c:'#C29A1F',sh:'d',r:3},
  Prot:{n:'LMW protein',c:'#B07A62',sh:'h',r:3.3},
  OC:{n:'Organic cations',c:'#5E8C6A',sh:'c',r:3},
  ATP:{n:'ATP → adenosine',c:'#7D8C99',sh:'c',r:2.8},
  PGE:{n:'PGE₂ / NO',c:'#E85DB1',sh:'d',r:3},
  Renin:{n:'Renin',c:'#B3242F',sh:'h',r:3.2},
  RBC:{n:'RBC',c:'#C8353E',sh:'e',r:3.2}
};
const OV_IONS=['Na','Cl','K','Ca','Mg','Glu','HCO3','H2O','H','OA'];
function drawIon(ctx,k,x,y,a=1,s=1){
  const d=IONS[k];if(!d||a<=0)return;const r=d.r*s;ctx.globalAlpha=Math.min(1,a);ctx.fillStyle=d.c;ctx.beginPath();
  switch(d.sh){
    case'c':case'w':ctx.arc(x,y,r,0,6.283);break;
    case'd':ctx.moveTo(x,y-r*1.25);ctx.lineTo(x+r*1.15,y);ctx.lineTo(x,y+r*1.25);ctx.lineTo(x-r*1.15,y);ctx.closePath();break;
    case's':ctx.rect(x-r,y-r,2*r,2*r);break;
    case't':ctx.moveTo(x,y-r*1.2);ctx.lineTo(x+r*1.1,y+r*.9);ctx.lineTo(x-r*1.1,y+r*.9);ctx.closePath();break;
    case'h':for(let i=0;i<6;i++){const q=Math.PI/3*i;ctx.lineTo(x+r*Math.cos(q),y+r*Math.sin(q));}ctx.closePath();break;
    case'e':ctx.ellipse(x,y,r*1.25,r*.8,0,0,6.283);break;
  }
  ctx.fill();
  if(d.ring){ctx.lineWidth=.9*s;ctx.strokeStyle='rgba(255,255,255,.9)';ctx.stroke();}
  if(d.sh==='w'){ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.arc(x-r*.35,y-r*.35,r*.35,0,6.283);ctx.fill();}
  ctx.globalAlpha=1;
}
function ionIcon(k){const d=IONS[k],c=d.c;let s;
  switch(d.sh){case'd':s=`<path d="M6 1 L11 6 L6 11 L1 6Z" fill="${c}"/>`;break;case's':s=`<rect x="2" y="2" width="8" height="8" fill="${c}"/>`;break;
  case't':s=`<path d="M6 1 L11 10 L1 10Z" fill="${c}"/>`;break;case'h':s=`<path d="M11 6 L8.5 10.3 L3.5 10.3 L1 6 L3.5 1.7 L8.5 1.7Z" fill="${c}"/>`;break;
  default:s=`<circle cx="6" cy="6" r="4.6" fill="${c}" ${d.ring?'stroke="#fff" stroke-width="1"':''}/>`;}
  return`<svg viewBox="0 0 12 12" aria-hidden="true">${s}</svg>`;}

/* ============================== nephron segments ============================== */
const SEGS=['pct','tdl','tat','tal','md','dct','cnt','ccd','omcd','imcd'];
const SEGINFO={
  glom:{n:'Glomerulus and Bowman’s capsule',view:'glom',h:'First capillary bed. High glomerular capillary pressure (P<sub>GC</sub> ≈ 50–55 mmHg) between two resistance vessels filters ≈120 mL/min (≈180 L/day) of protein-free plasma. GFR = K<sub>f</sub> × NFP.'},
  aff:{n:'Afferent arteriole',view:'glom',h:'Inflow resistance. Constriction lowers RPF, P<sub>GC</sub> and GFR together (FF changes little). Site of the myogenic response, TGF (adenosine A₁) and sympathetic α₁ tone; PGE₂ and NO dilate it. Its wall holds the renin-secreting granular cells.'},
  eff:{n:'Efferent arteriole',view:'glom',h:'Outflow resistance linking the two capillary beds. Moderate constriction (Ang II at AT₁) lowers RPF but raises P<sub>GC</sub>: GFR maintained, FF ↑. ACE inhibitors and ARBs remove this tone.'},
  pct:{n:'Proximal convoluted tubule',view:'pct',h:'Bulk, iso-osmotic reabsorption: ≈65–70% of filtered Na⁺ and water, essentially all glucose and amino acids, ≈80% of HCO₃⁻, most phosphate. Secretes organic anions and cations (PAH, penicillin, diuretics, creatinine).'},
  tdl:{n:'Thin descending limb',view:'loop',tab:'tdl',h:'Highly water permeable (AQP1), little solute transport. Water leaves into the hypertonic medulla, so tubular fluid concentrates until it matches the interstitium (up to ≈1200 mOsm/kg at the bend).'},
  tat:{n:'Thin ascending limb',view:'loop',tab:'tat',h:'Water-impermeable. NaCl leaves passively, beginning to dilute the tubular fluid.'},
  tal:{n:'Thick ascending limb',view:'tal',h:'The diluting segment: NKCC2 reabsorbs ≈25% of filtered NaCl with no water. ROMK recycling makes the lumen positive, driving paracellular Ca²⁺ and Mg²⁺ reabsorption. Builds the medullary gradient. Loop-diuretic and Bartter site.'},
  md:{n:'Macula densa (juxtaglomerular apparatus)',view:'md',h:'Specialized TAL cells that sense luminal NaCl through NKCC2. High NaCl → ATP/adenosine → afferent constriction and less renin (tubuloglomerular feedback). Low NaCl → PGE₂/NO → afferent dilation and renin release.'},
  dct:{n:'Early distal convoluted tubule',view:'dct',h:'≈5% of filtered NaCl through NCC; very low water permeability, so dilution continues. PTH-sensitive Ca²⁺ reabsorption through TRPV5; Mg²⁺ through TRPM6. Thiazide and Gitelman site.'},
  cnt:{n:'Late DCT and connecting tubule',view:'cd',tab:'pc',h:'Aldosterone-sensitive principal cells appear (ENaC, ROMK/BK). Na⁺ reabsorption here is coupled to K⁺ secretion. Water permeability depends on AVP.'},
  ccd:{n:'Cortical collecting duct',view:'cd',tab:'pc',h:'Principal cells: ENaC Na⁺ reabsorption, ROMK/BK K⁺ secretion, AQP2 with AVP. α-intercalated cells secrete H⁺; β-intercalated cells secrete HCO₃⁻.'},
  omcd:{n:'Outer medullary collecting duct',view:'cd',tab:'aic',h:'α-intercalated cells secrete H⁺ (H⁺-ATPase, H⁺/K⁺-ATPase) and reclaim K⁺. AVP-dependent water reabsorption into the hypertonic interstitium.'},
  imcd:{n:'Inner medullary collecting duct',view:'cd',tab:'imcd',h:'Final adjustment. AVP inserts AQP2 and activates UT-A1/UT-A3 (urea recycling). Sets final urine osmolality (≈50–1200 mOsm/kg) and volume.'},
  ptc:{n:'Peritubular capillaries',view:'ptc',h:'Second capillary bed. After filtration its blood has low hydrostatic and high oncotic pressure, favoring uptake of reabsorbate from the cortical interstitium.'},
  vr:{n:'Vasa recta',view:'loop',tab:'cc',h:'Hairpin capillaries from juxtamedullary efferent arterioles carrying ≈10% of RBF. Countercurrent exchange preserves the medullary gradient; the low flow makes the outer medulla vulnerable to ischemia.'}
};

/* baseline fraction of the FILTERED load reabsorbed in each segment */
const BASEFRAC={
  Na:{pct:.66,tat:.02,tal:.23,dct:.05,cnt:.015,ccd:.01,omcd:.005,imcd:.005},
  Cl:{pct:.56,tat:.03,tal:.25,dct:.07,cnt:.03,ccd:.035,omcd:.01,imcd:.01},
  K:{pct:.65,tal:.25,dct:.02},
  Ca:{pct:.65,tal:.22,dct:.1,cnt:.01},
  Mg:{pct:.2,tal:.65,dct:.1},

/* ============================== hemodynamic model ============================== */
/* Resistances in series (afferent, efferent, post-glomerular). Myogenic/TGF autoregulation scales afferent resistance with MAP.
   Filtration integrated along the capillary with Landis–Pappenheimer oncotic pressure; Bowman's pressure rises with tubular flow. */
const HCT=0.45,PV=4,RA0=0.0383,RE0=0.0333,RV0=0.0101,Q0=96/(RA0+RE0+RV0);
function LP(c){return 2.1*c+0.16*c*c+0.009*c*c*c;}
let KF=13.4;
function hemo(p,kfo){
  const map=p.map??100,cp=p.cp??7,kf=(kfo??KF)*(p.kf??1);
  let auto=1;if(p.auto!==false)auto=clamp(((map-PV)/Q0-RE0-RV0)/RA0,0.55,2.4);
  const Ra=RA0*(p.ra??1)*auto,Re=RE0*(p.re??1);
  const Q=Math.max(0,(map-PV)/(Ra+Re+RV0));const Pgc=map-Q*Ra;const RPF=Q*(1-HCT);
  const N=100;let F=120,PBS=15,piOut=LP(cp),prof=[];
  for(let it=0;it<40;it++){
    PBS=(p.pbs??0)+1+14*Math.min(F,300)/120;let G=0;const pr=[];
    for(let i=0;i<=N;i++){const c=cp*RPF/Math.max(1e-6,RPF-G);const pi=LP(c);const nfp=Pgc-PBS-pi;piOut=pi;if(it===39)pr.push({x:i/N,pi,nfp});if(i<N&&nfp>0)G+=kf*nfp/N;}
    F=0.5*F+0.5*G;if(it===39)prof=pr;
  }
  const GFR=F,FF=RPF>0?GFR/RPF:0,Ppc=Pgc-(Q-GFR)*Re;
  return{map,Q,RPF,Pgc,GFR,FF,piIn:LP(cp),piOut,Ppc,PBS,Ra,Re,auto,prof};
}

  const s=state.scn,frac={};
  for(const ion in BASEFRAC){frac[ion]={...BASEFRAC[ion],...((s.frac||{})[ion]||{})};}
  const fe={};
  for(const ion in frac){let sum=0;for(const k in frac[ion])sum+=frac[ion][k];fe[ion]=Math.max(0,1-sum);}
  const sec=s.secr||{};

  const osm={...BASEOSM,...(s.osm||{})};
  state.model={frac,fe,osm,secr:{K:sec.K??1,Hd:sec.Hd??1,Hpct:sec.Hpct??1,OA:sec.OA??1}};
}

class Layer{
  constructor(svg,canvas,w,h){this.svg=svg;this.canvas=canvas;this.ctx=canvas.getContext('2d');this.w=w;this.h=h;this.ro=new ResizeObserver(()=>this.fit());this.ro.observe(svg);this.fit();}
  fit(){const r=this.svg.getBoundingClientRect();const dpr=window.devicePixelRatio||1;this.canvas.width=Math.max(1,Math.round(r.width*dpr));this.canvas.height=Math.max(1,Math.round(r.height*dpr));
    const s=Math.min(r.width/this.w,r.height/this.h)||1;const ox=(r.width-this.w*s)/2,oy=(r.height-this.h*s)/2;this.ctx.setTransform(dpr*s,0,0,dpr*s,dpr*ox,dpr*oy);}
  clear(){const c=this.ctx;c.save();c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,this.canvas.width,this.canvas.height);c.restore();}
  destroy(){this.ro.disconnect();}
}
function samplePath(el,step=2){const L=el.getTotalLength();const n=Math.ceil(L/step)+1;const xs=new Float32Array(n),ys=new Float32Array(n);
  for(let i=0;i<n;i++){const p=el.getPointAtLength(Math.min(L,i*step));xs[i]=p.x;ys[i]=p.y;}return{L,xs,ys,step};}
function ptAt(S,d){const i=clamp(Math.round(d/S.step),0,S.xs.length-1);return[S.xs[i],S.ys[i]];}
function normAt(S,d){const a=ptAt(S,d-3),b=ptAt(S,d+3);const dx=b[0]-a[0],dy=b[1]-a[1];const m=Math.hypot(dx,dy)||1;return[-dy/m,dx/m];}

/* ---------- overview particles ---------- */
function chooseIon(){const vis=OV_IONS.filter(k=>state.vis.has(k)&&SPAWNW[k]);let tot=0;for(const k of vis)tot+=SPAWNW[k];let u=Math.random()*tot;for(const k of vis){u-=SPAWNW[k];if(u<=0)return k;}return vis[0];}
function decideExit(ion){
  const fr=state.model.frac[ion]||{};const u=Math.random();let cum=0;
  for(let i=0;i<SEGS.length;i++){const seg=SEGS[i];const f=fr[seg]||0;if(!f)continue;cum+=f;
    if(u<cum){const L=OV.S[seg].L;let r=Math.random(),pos;
      if(seg==='pct'){if(ion==='Glu')pos=state.scn.gluLate?0.5+0.5*r:0.75*Math.pow(r,1.3);else if(ion==='HCO3')pos=0.65*r;else if(ion==='Cl')pos=0.3+0.7*r;else pos=r;}else pos=r;
      return{seg:i,s:pos*L};}}
  return null;
}
function spawnTub(){const ion=chooseIon();if(!ion)return;const ex=decideExit(ion);
  OV.parts.push({ion,seg:0,s:0,mode:'lum',ex,t:0,jit:rnd(-2.2,2.2)});}
function spawnSec(ion,segName){const i=SEGS.indexOf(segName);const S=OV.S[segName];const s=Math.random()*S.L;const sign=Math.random()<.5?-1:1;
  OV.parts.push({ion,seg:i,s,mode:'in',ex:null,t:0,sign,jit:rnd(-2,2)});}
function ovStep(dt){
  const m=state.model,H=state.H;const gf=clamp(H.GFR/120,0,2.2),bf=clamp(H.Q/Q0,0,2);
  OV.acc.tub+=dt*16*gf;while(OV.acc.tub>=1){OV.acc.tub--;if(OV.parts.length<520)spawnTub();}
  const sec=[['K','cnt',.35*m.secr.K],['K','ccd',.35*m.secr.K],['H','pct',.9*m.secr.Hpct],['H','ccd',.3*m.secr.Hd],['H','omcd',.35*m.secr.Hd],['OA','pct',.8*m.secr.OA]];
  for(const [ion,seg,rate] of sec){if(!state.vis.has(ion))continue;const key=ion+seg;OV.acc[key]=(OV.acc[key]||0)+dt*rate;while(OV.acc[key]>=1){OV.acc[key]--;spawnSec(ion,seg);}}
  OV.acc.blood+=dt*11*bf;while(OV.acc.blood>=1){OV.acc.blood--;OV.blood.push({route:Math.random()<.85?['aff','tuft','eff','ptc']:['aff','tuft','eff','dvr','avr'],i:0,s:0,j:rnd(-1.5,1.5)});}
  OV.acc.filt+=dt*9*gf;while(OV.acc.filt>=1){OV.acc.filt--;const a=Math.random()*6.283;OV.filt.push({a,r:rnd(8,22),t:0});}
  const keep=[];
  for(const p of OV.parts){
    if(p.mode==='lum'){const seg=SEGS[p.seg];p.s+=SPEED[seg]*dt;
      if(p.ex&&p.ex.seg===p.seg&&p.s>=p.ex.s){p.mode='out';p.t=0;p.sign=Math.random()<.5?-1:1;}
      else if(p.s>=OV.S[seg].L){p.s-=OV.S[seg].L;p.seg++;if(p.seg>=SEGS.length){p.mode='uri';p.t=0;p.seg=SEGS.length-1;p.s=OV.S.imcd.L;}}
      keep.push(p);}
    else if(p.mode==='out'){p.t+=dt;if(p.t<0.9)keep.push(p);}
    else if(p.mode==='in'){p.t+=dt;if(p.t>=0.7){p.mode='lum';p.ex=null;}keep.push(p);}
    else if(p.mode==='uri'){p.t+=dt;if(p.t<1.2)keep.push(p);}
  }
  OV.parts=keep;
  const kb=[];const bspd={aff:170,tuft:85,eff:140,ptc:120,dvr:55,avr:60};
  for(const b of OV.blood){const k=b.route[b.i];b.s+=bspd[k]*dt*Math.max(.25,bf);if(b.s>=OV.B[k].L){b.s-=OV.B[k].L;b.i++;}if(b.i<b.route.length)kb.push(b);}
  OV.blood=kb;
  OV.filt=OV.filt.filter(f=>(f.t+=dt)<0.8);
}
function ovDraw(){
  const L=OV.layer;if(!L)return;L.clear();const c=L.ctx;
  for(const b of OV.blood){const [x,y]=ptAt(OV.B[b.route[b.i]],b.s);drawIon(c,'RBC',x+b.j,y+b.j*.6,.9,.85);}
  if(state.vis.has('H2O'))for(const f of OV.filt){const r=f.r+f.t*24;drawIon(c,'H2O',150+Math.cos(f.a)*Math.min(r,38),155+Math.sin(f.a)*Math.min(r,38),1-f.t/0.8,.8);}
  for(const p of OV.parts){
    if(!state.vis.has(p.ion))continue;const S=OV.S[SEGS[p.seg]];
    if(p.mode==='lum'){const [x,y]=ptAt(S,p.s);const [nx,ny]=normAt(S,p.s);drawIon(c,p.ion,x+nx*p.jit,y+ny*p.jit,1);}
    else if(p.mode==='out'){const [x,y]=ptAt(S,p.s);const [nx,ny]=normAt(S,p.s);const e=1-Math.pow(1-p.t/0.9,2);drawIon(c,p.ion,x+nx*p.sign*(4+20*e),y+ny*p.sign*(4+20*e),1-p.t/0.9);}
    else if(p.mode==='in'){const [x,y]=ptAt(S,p.s);const [nx,ny]=normAt(S,p.s);const e=p.t/0.7;drawIon(c,p.ion,x+nx*p.sign*22*(1-e),y+ny*p.sign*22*(1-e),Math.min(1,e*2));}
    else if(p.mode==='uri'){drawIon(c,p.ion,560+p.jit*2,772+p.t*22,1-p.t/1.2);}
  }
}

function renderPW(key,title){

  const cols=Math.max(...d.nodes.map(n=>n[1]))+1,rows=Math.max(...d.nodes.map(n=>n[2]))+1;const W=cols*cw+10,Hh=rows*rh+10;
  const pos={};d.nodes.forEach(n=>pos[n[0]]={x:5+n[1]*cw+cw/2,y:5+n[2]*rh+rh/2});

   <marker id="${id}p" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,-4.5L10,0L0,4.5Z" fill="var(--good)"/></marker>
   <marker id="${id}g" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="9" markerHeight="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,-4.5L10,0L0,4.5Z" fill="var(--ink3)"/></marker>

  const boxT=(dx,dy)=>Math.min((nw/2+3)/Math.max(1e-6,Math.abs(dx)),(nh/2+3)/Math.max(1e-6,Math.abs(dy)));
  for(const e of d.edges){const a=pos[e[0]],b=pos[e[1]];if(!a||!b)continue;const dx=b.x-a.x,dy=b.y-a.y;const t1=boxT(dx,dy),t2=boxT(dx,dy)+(e[2]==='-'?0:0.0);
    const x1=a.x+dx*t1,y1=a.y+dy*t1,x2=b.x-dx*t2,y2=b.y-dy*t2;const col=e[2]==='+'?'var(--good)':e[2]==='-'?'var(--bad)':'var(--ink3)';const mk=e[2]==='+'?'p':e[2]==='-'?'m':'g';
    let path;if(e[0]==='ang2'&&e[1]==='renin'){path=`M${a.x} ${a.y-nh/2-3} C ${a.x} ${a.y-50}, ${b.x+60} ${b.y}, ${b.x+nw/2+3} ${b.y+6}`;}
    else path=`M${x1} ${y1} L${x2} ${y2}`;
    s+=`<path d="${path}" fill="none" stroke="${col}" stroke-width="1.8" marker-end="url(#${id}${mk})"/>`;
    if(e[3]){const mx=(x1+x2)/2,my=(y1+y2)/2-4;s+=`<text class="pwT" x="${mx}" y="${my}" text-anchor="middle" style="font-size:10px;fill:var(--ink3);paint-order:stroke;stroke:var(--panel);stroke-width:3px">${esc(e[3])}</text>`;}}
  for(const n of d.nodes){const p=pos[n[0]];const st=(n[5]||{})[sid]||'';const drug=n[4]==='drug';const on=drug&&st==='on';
    let fill=drug?(on?'var(--bad)':'color-mix(in srgb, var(--bad) 10%, var(--panel))'):'var(--panel2)';let stroke=drug?'var(--bad)':'var(--line)',sw=1.2,dash='';
    if(st==='up'){stroke='var(--up)';sw=2.6;}else if(st==='down'){stroke='var(--dn)';sw=2.6;}else if(st==='block'){stroke='var(--bad)';sw=2.6;dash='5 3';}
    s+=`<g><rect x="${p.x-nw/2}" y="${p.y-nh/2}" width="${nw}" height="${nh}" rx="${drug?18:7}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
    const lines=n[3].split('\n');lines.forEach((ln,i)=>{s+=`<text class="pwT" x="${p.x}" y="${p.y+4+(i-(lines.length-1)/2)*13}" text-anchor="middle" style="${on?'fill:#fff;font-weight:600':''}">${esc(ln)}</text>`;});

    s+='</g>';}
  return s+'</svg><p class="pwlegend">Green arrows stimulate, red bars inhibit, grey arrows lead to the next step. Rounded red nodes are drugs or disorders (filled when active). Outlined badges show the current simulation: ↑ increased, ↓ decreased, ✕ blocked.</p>';

function fluxPoly(it,fl){
  const [,from,to]=fl,y=it.y,j=()=>rnd(-7,7);
  const L=()=>[rnd(20,135),y+j()],Ca=()=>[rnd(185,255),y+j()],Cb=()=>[rnd(335,405),y+j()],I=()=>[rnd(445,515),y+j()],CAP=()=>[rnd(540,588),y+j()];
  if(it.side==='para'){const a=[rnd(30,135),50+rnd(-3,3)],m1=[160,50],m2=[430,50],b=[rnd(455,520),50+rnd(-2,14)];return from==='L'?[a,m1,m2,b,[rnd(540,585),b[1]+rnd(0,12)]]:[b,m2,m1,a];}
  if(it.side==='ap')return from==='L'?[L(),[160,y],Ca()]:[Ca(),[160,y],L()];
  if(it.side==='bl'){if(from==='C')return[Cb(),[430,y],I(),CAP()];return to==='C'&&(it.t.k==='OAT'||it.t.k==='OCT2')?[CAP(),I(),[430,y],Cb()]:[I(),[430,y],Cb()];}
  if(it.side==='lum')return[L(),[it.x,y]];
  return null;
}
function polyLen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L;}
function polyAt(p,d){for(let i=1;i<p.length;i++){const l=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);if(d<=l){const t=l?d/l:0;return[lerp(p[i-1][0],p[i][0],t),lerp(p[i-1][1],p[i][1],t)];}d-=l;}return p[p.length-1];}
/* Particle engine used by detail diagrams */
function makeEngine(layer){
  return{layer,parts:[],emit(ion,poly,speed=80,size=1.15){const L=polyLen(poly);this.parts.push({ion,poly,L,d:0,speed,size});},
    step(dt){for(const p of this.parts)p.d+=p.speed*dt;this.parts=this.parts.filter(p=>p.d<p.L);},
    draw(){const c=this.layer.ctx;for(const p of this.parts){const [x,y]=polyAt(p.poly,p.d);const f=p.d/p.L;const a=f<.1?f/.1:f>.85?(1-f)/.15:1;drawIon(c,p.ion,x,y,a,p.size);}}};
}
function cellStageHTML(cid,tall){return`<div class="cellstage${tall?' tall':''}" id="cs-${cid}">${cellSVG(cid,cellLayout(cid))}<canvas aria-hidden="true"></canvas></div>

function mountCell(cid,root){
  const wrap=$('#cs-'+cid,root);const svg=$('svg',wrap),cv=$('canvas',wrap);const items=cellLayout(cid);

       <div>${esc(t.info)}</div>${fx.length?`<div class="meta"><b>Moves:</b> ${[...new Set(fx)].map(esc).join(', ')}</div>`:''}
       ${t.reg?`<div class="meta"><b>Regulation:</b> ${esc(t.reg)}</div>`:''}${t.drug?`<div class="meta"><b>Drugs:</b> ${esc(t.drug)}</div>`:''}${t.dis?`<div class="meta"><b>Disorders:</b> ${esc(t.dis)}</div>`:''}
       ${st?`<div class="meta" style="color:${st==='block'?'var(--bad)':st==='up'?'var(--up)':'var(--dn)'}"><b>In “${esc(state.scn.n)}”:</b> ${st==='block'?'blocked / lost':st==='up'?'activity increased':'activity decreased'} (×${modOf(cid+':'+t.k).toFixed(2)})</div>`:''}
       ${t.scn&&state.scn.id!==t.scn?`<div class="btnrow"><button data-scn="${t.scn}">Simulate: ${esc(SCNMAP[t.scn].n)}</button></div>`:''}`;bindCommon(info);};

function bindCtrls(root,onChange){
  $$('[data-h]',root).forEach(inp=>inp.addEventListener('input',()=>{const k=inp.dataset.h;state.hp[k]=HCTRL[k][5]?Math.exp(+inp.value):+inp.value;state.H=hemo(state.hp);updOut(root);renderReadout();onChange();}));
  const a=$('#autoChk',root);if(a)a.onchange=()=>{state.hp.auto=a.checked;state.H=hemo(state.hp);renderReadout();onChange();};updOut(root);}
const PRESETS=[['Normal',{}],['Afferent constriction',{ra:1.8}],['Afferent dilation',{ra:.6}],['Efferent constriction, moderate',{re:1.6}],['Efferent constriction, severe',{re:4}],
  ['Efferent dilation (ACEi/ARB)',{re:.65}],['Hypotension, MAP 65',{map:65}],['Hypertension, MAP 160',{map:160}],['Ureteral obstruction',{pbs:18}],['Hypoalbuminemia',{cp:4.5}],['Mesangial contraction (↓K_f)',{kf:.55}]];
function presetHTML(){return`<div class="btnrow">${PRESETS.map(([n],i)=>`<button data-pre="${i}">${esc(n).replace('K_f','K<sub>f</sub>')}</button>`).join('')}</div>`;}
function bindPresets(root,onChange){$$('[data-pre]',root).forEach(b=>b.onclick=()=>{state.hp={...BASEHEMO,...PRESETS[+b.dataset.pre][1]};state.H=hemo(state.hp);syncInputs(root);renderReadout();onChange();});}
function arr(v,v0,tol=.04){const a=cmp(v,v0,tol);return`<span class="ar ${arrowOf(a)}">${a}</span>`;}
function hemoOuts(H){return`<div class="outs">
  <div>RBF ${arr(H.Q,H0.Q)}<b>${fmt(H.Q)}</b>mL/min</div><div>RPF ${arr(H.RPF,H0.RPF)}<b>${fmt(H.RPF)}</b>mL/min</div><div>GFR ${arr(H.GFR,H0.GFR)}<b>${fmt(H.GFR)}</b>mL/min</div>
  <div>FF ${arr(H.FF,H0.FF)}<b>${fmt(H.FF*100,1)}%</b>GFR ÷ RPF</div><div>P<sub>GC</sub> ${arr(H.Pgc,H0.Pgc,.02)}<b>${fmt(H.Pgc)}</b>mmHg</div><div>P<sub>BS</sub><b>${fmt(H.PBS)}</b>mmHg</div>
  <div>π<sub>GC</sub> efferent end<b>${fmt(H.piOut)}</b>mmHg</div><div>NFP afferent end<b>${fmt(H.Pgc-H.PBS-H.piIn)}</b>mmHg</div><div>Peritubular P ${arr(H.Ppc,H0.Ppc)}<b>${fmt(H.Ppc)}</b>mmHg</div></div>`;}
function hemoChain(H){
  const p=state.hp,c=[],e=[],d=[];const raEff=H.Ra/RA0,reEff=H.Re/RE0;
  if(Math.abs(p.map-100)>3)c.push(`MAP ${p.map>100?'↑':'↓'} (${fmt(p.map)} mmHg)`);
  if(Math.abs(raEff-1)>.04)c.push(`Afferent resistance ${raEff>1?'↑':'↓'} (×${raEff.toFixed(2)}${p.auto&&Math.abs(H.auto-1)>.02?', includes autoregulation':''})`);
  if(Math.abs(reEff-1)>.04)c.push(`Efferent resistance ${reEff>1?'↑':'↓'} (×${reEff.toFixed(2)})`);
  if(Math.abs(p.kf-1)>.03)c.push(`K<sub>f</sub> ${p.kf>1?'↑':'↓'}`);if(p.pbs>0)c.push('P<sub>BS</sub> ↑');if(Math.abs(p.cp-7)>.15)c.push(`Plasma protein ${p.cp>7?'↑':'↓'} → π<sub>GC</sub> ${p.cp>7?'↑':'↓'}`);
  for(const [n,v,v0,t] of [['RPF',H.RPF,H0.RPF,.04],['P<sub>GC</sub>',H.Pgc,H0.Pgc,.02],['GFR',H.GFR,H0.GFR,.04],['FF',H.FF,H0.FF,.04]]){const a=cmp(v,v0,t);e.push(`${n} <span class="ar ${arrowOf(a)}">${a}</span>`);}
  const g=cmp(H.GFR,H0.GFR),ff=cmp(H.FF,H0.FF);
  if(g==='↓')d.push('↓ NaCl to macula densa → ↓ adenosine, ↑ PGE₂/NO → afferent dilation + renin ↑');
  if(g==='↑')d.push('↑ NaCl to macula densa → ATP/adenosine (A₁) → afferent constriction, renin ↓');
  if(ff==='↑')d.push('↑ FF → peritubular π ↑, P ↓ → ↑ PCT reabsorption');if(ff==='↓')d.push('↓ FF → peritubular π ↓ → ↓ PCT reabsorption');
  if(H.Pgc>63)d.push('Sustained ↑ P<sub>GC</sub> → hyperfiltration injury risk');
  if(reEff>2.5&&g!=='↑')d.push('Severe efferent constriction: RPF falls so far that rising π<sub>GC</sub> overrides P<sub>GC</sub>');
  if(!c.length)return`<div class="flow"><span class="n">Baseline</span><span class="a">→</span><span class="n">GFR ≈120 mL/min, FF ≈19%</span></div>`;
  let note='';if(Math.abs(raEff-1)>.04&&Math.abs(reEff-1)<=.04)note='<p class="note">Afferent changes move RPF and GFR in the same direction, so FF changes relatively little (here GFR is more pressure-sensitive than RPF, so FF drifts the same way).</p>';
  if(Math.abs(reEff-1)>.04&&reEff>1&&reEff<2.5)note='<p class="note">“Pressure trap”: outflow resistance holds pressure in the glomerulus while flow falls, so a larger fraction of plasma is filtered.</p>';
  return`<div class="flow">${c.map(x=>`<span class="n">${x}</span>`).join('<span class="a">+</span>')}<span class="a">→</span>${e.map(x=>`<span class="n">${x}</span>`).join('')}${d.length?'<span class="a">→</span>'+d.map(x=>`<span class="n">${x}</span>`).join(''):''}</div>${note}`;
}

  }
  else if(tab==='starling'){

    ${ctrlHTML(['kf','pbs','cp','ra','re'],false)}${presetHTML()}<div id="stOut"></div>
    <h3>Four Starling forces</h3>
    <div class="eq">NFP = (P<sub>GC</sub> − P<sub>BS</sub>) − (π<sub>GC</sub> − π<sub>BS</sub>)<small>usually simplified to NFP ≈ P<sub>GC</sub> − (P<sub>BS</sub> + π<sub>GC</sub>) because π<sub>BS</sub> ≈ 0</small></div>
    <dl class="vars"><dt>P<sub>GC</sub></dt><dd>glomerular capillary hydrostatic pressure (≈50–55 mmHg): the main force favoring filtration, set by afferent and efferent resistance</dd>
    <dt>P<sub>BS</sub></dt><dd>Bowman’s space hydrostatic pressure (≈15 mmHg): opposes filtration; rises with obstruction to tubular flow</dd>

    <h3>Renal autoregulation</h3><p>The kidney keeps RBF and GFR relatively stable as MAP varies across ≈80–170 mmHg. Afferent resistance rises in proportion to pressure while efferent resistance stays nearly constant (Boron and Boulpaep). Below the range, flow and filtration become pressure-dependent; turn autoregulation off to see the passive, linear relationship.</p>
    <h4>Myogenic response (fast)</h4><div class="flow"><span class="n">↑ Renal perfusion pressure</span><span class="a">→</span><span class="n">Afferent wall stretches</span><span class="a">→</span><span class="n">Stretch-activated channels depolarize smooth muscle; Ca²⁺ enters</span><span class="a">→</span><span class="n">Contraction narrows the lumen</span><span class="a">→</span><span class="n">Buffers the rise in RBF and GFR</span></div>

      const b=panel(140,120,1600,'q','var(--art)','Renal blood flow (mL/min)',[0,600,1200]);

    s+=`<text class="chT" x="${X(70)}" y="40">P_Cr ≈ production ÷ GFR (normal ≈1 mg/dL at 120 mL/min)</text><text class="chT" x="310" y="220" text-anchor="middle">GFR (mL/min)</text><text class="chT" transform="translate(16 110) rotate(-90)" text-anchor="middle">plasma creatinine (mg/dL)</text>`;

function gluCalc(P,gfr,sglt2i){const F=gfr*P/100;const Tm=sglt2i?80:375,th=sglt2i?.95:.995;const R=(F+Tm-Math.sqrt(Math.max(0,(F+Tm)**2-4*th*F*Tm)))/(2*th);return{F,R:Math.min(R,F),E:Math.max(0,F-R)};}
VIEWS.pct=(body,tab)=>{

    <ol><li><strong>HCO₃⁻:</strong> H⁺ secreted by NHE3 meets filtered HCO₃⁻; CA IV makes CO₂ + H₂O, which enter the cell; CA II regenerates H⁺ + HCO₃⁻; HCO₃⁻ exits via NBCe1. ≈80% of filtered HCO₃⁻ is reclaimed here.</li>
    <li><strong>Cl⁻:</strong> preferential early HCO₃⁻ and nutrient uptake raises luminal Cl⁻ in the late PCT; Cl⁻ then moves transcellularly and paracellularly.</li>

    <tr><td>Proteins and peptides</td><td>Megalin/cubilin endocytosis → lysosomal degradation</td><td>Tubular dysfunction → low-molecular-weight proteinuria</td></tr></table>`;

    <div id="gluOut"></div>
    <h3>Threshold, Tm and splay</h3>

    <tr><td>Splay</td><td>Rounded region between threshold and Tm</td><td>Nephrons saturate at slightly different filtered loads</td></tr><tr><td>Excretion</td><td>Filtered load − reabsorption</td><td>Rises once transporter capacity is exceeded</td></tr></table>

      $('#gluChart',body).innerHTML=s;
      $('#gluOut',body).innerHTML=`<div class="outs"><div>Filtered load<b>${fmt(c.F)}</b>mg/min</div><div>Reabsorbed<b>${fmt(c.R)}</b>mg/min</div><div>Excreted<b>${fmt(c.E,c.E<10?1:0)}</b>mg/min</div><div>FE glucose<b>${fmt(c.F?c.E/c.F*100:0,1)}%</b></div><div>Threshold<b>${thr??'>800'}</b>mg/dL</div></div>
       <div class="eq">Filtered load = ${G} mL/min × ${fmt(P/100,2)} mg/mL = <strong>${fmt(c.F)} mg/min</strong></div> <div class="eq">Excretion = ${fmt(c.F)} − ${fmt(c.R)} = <strong>${fmt(c.E,1)} mg/min</strong></div>`;};

  }
  else if(tab==='tfp'){
    const SER=[['Inulin',x=>1/(1-.67*x),'#2F7FD0'],['PAH (secreted)',x=>Math.min(4,(1/(1-.67*x))*(1+.35*x)),'#9C7550'],['Urea',x=>1+.5*x,'#8792A6'],['Cl⁻',x=>1+.24*(1-Math.exp(-3*x)),'#2DB86C'],
      ['Na⁺, osmolality',x=>1,'#EDB91E'],['K⁺',x=>1-.05*x,'#9466E8'],['Phosphate',x=>1-.6*x,'#5A68C4'],['HCO₃⁻',x=>.25+.75*Math.exp(-3.5*x),'#13AFC4'],['Glucose, amino acids',x=>Math.exp(-5*x),'#E0442F']];
    body.innerHTML=`${scnBox('pct')}<svg class="chart" id="tfChart" viewBox="0 0 600 330" role="img" aria-label="Tubular fluid to plasma concentration ratios along the proximal tubule"></svg>
    <div class="ctrls"><label>Position along the proximal tubule<output id="o-tx"></output><input type="range" id="tx" min="0" max="100" value="100"></label></div><div id="tfOut"></div>
    <h3>Reading TF/P</h3><p>TF/P compares a solute’s concentration in tubular fluid with its plasma concentration. Interpret it relative to 1.0:</p>
    <ul><li><strong>TF/P = 1</strong>: solute and water were reabsorbed proportionally (Na⁺ and osmolality in the PCT, the definition of iso-osmotic reabsorption).</li><li><strong>TF/P &lt; 1</strong>: solute reabsorbed faster than water (glucose, amino acids, HCO₃⁻).</li><li><strong>TF/P &gt; 1</strong>: water reabsorbed faster than the solute (Cl⁻, urea, inulin) or the solute was secreted (PAH).</li></ul>
    <div class="eq">Fraction of filtered water remaining = 1 ÷ (TF/P)<sub>inulin</sub></div> <div class="eq">Fraction of filtered x remaining = (TF/P)<sub>x</sub> ÷ (TF/P)<sub>inulin</sub></div>

/* ============================== loop of Henle / countercurrent ============================== */
VIEWS.loop=(body,tab)=>{
  if(tab!=='cc'){const cid=tab;body.innerHTML=`${scnBox('loop')}${cellStageHTML(cid)}
    ${cid==='tdl'?`<h3>Water leaves, solute stays</h3><p>The thin descending limb has abundant AQP1 and little active solute transport. As it dives into an interstitium that rises from ≈300 to ≈1200 mOsm/kg, water leaves osmotically and the tubular fluid concentrates to match the interstitium at each level. Urea enters from the interstitium (UT-A2), part of urea recycling.</p>`:
    `<h3>Salt leaves, water stays</h3><p>The thin ascending limb is water-impermeable. Fluid arriving from the bend is NaCl-rich relative to the interstitium, so NaCl diffuses out passively (ClC-Ka for Cl⁻, paracellular Na⁺) and dilution begins before the active thick ascending limb.</p>`}

    mountCell(cid,body);bindCommon(body);return;}
  const sid=state.scn.id;const L={adh:sid==='di'?'absent':sid==='dehyd'||sid==='hemorrhage'?'max':'normal',loop:sid==='loop'||sid==='bartter',vr:1};
  body.innerHTML=`${scnBox('loop')}<div class="cellstage tall" id="ccStage"><svg viewBox="0 0 600 440" role="img" aria-label="Countercurrent multiplier and vasa recta exchanger"></svg><canvas aria-hidden="true"></canvas></div>
  <div class="ctrls"><div><span class="note">AVP (ADH)</span><br><span class="seg-toggle" role="group" aria-label="AVP level">${['absent','normal','max'].map(a=>`<button data-adh="${a}" class="${L.adh===a?'on':''}">${a==='max'?'maximal':a}</button>`).join('')}</span></div>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="ccLoop" ${L.loop?'checked':''}> Block NKCC2 (loop diuretic)</label>
  <label>Vasa recta blood flow<output id="o-vr"></output><input type="range" id="ccVr" min="0.3" max="3" step="0.05" value="1"></label></div>
  <div id="ccOut"></div>
  <h3>Countercurrent multiplication</h3>
  <ol><li>The thick ascending limb pumps NaCl into the interstitium without water (the “single effect”, ≈200 mOsm/kg at any level).</li><li>The descending limb, permeable to water, equilibrates with that hypertonic interstitium, delivering more concentrated fluid to the bend.</li><li>Flow carries the concentrated fluid around the hairpin, where the ascending limb pumps again; repeated along the loop, the small horizontal gradient multiplies into a large vertical one (≈300 → 1200 mOsm/kg). Long-looped juxtamedullary nephrons (≈10–15%) make the deepest gradient.</li>
  <li>AVP adds urea recycling: water leaves the cortical and outer medullary collecting ducts, concentrating urea, which then leaves the IMCD through UT-A1/A3 and supplies about half of inner-medullary osmolality.</li></ol>
  <h3>Vasa recta: countercurrent exchange</h3><p>Descending vasa recta lose water and gain solute as they descend; ascending vasa recta do the opposite, so blood leaves the medulla only slightly hypertonic and the gradient is not washed away. Medullary flow is only ≈10% of RBF. High flow washes out the gradient; very low flow (ischemia) starves the thick ascending limb of O₂ and also impairs concentrating ability. The outer medulla is especially vulnerable during volume loss, hemorrhage or shock.</p>
  <table class="tbl"><tr><th></th><th>Cortical nephrons (≈85–90%)</th><th>Juxtamedullary nephrons (≈10–15%)</th></tr><tr><td>Glomerulus</td><td>Outer cortex</td><td>Near the corticomedullary junction</td></tr><tr><td>Loop of Henle</td><td>Short</td><td>Long, into the inner medulla</td></tr><tr><td>Post-glomerular capillaries</td><td>Peritubular capillaries</td><td>Vasa recta</td></tr><tr><td>Main role</td><td>Waste excretion and bulk reabsorption</td><td>Build and preserve the medullary gradient</td></tr></table>`;
  const stage=$('#ccStage',body),svg=$('svg',stage);const layer=new Layer(svg,$('canvas',stage),600,440);DV.layer=layer;const eng=makeEngine(layer);
  const lev=[70,140,210,280,350,400];let O;
  const comp=()=>{let im0=L.adh==='absent'?600:1200;if(L.loop)im0=420;const f=L.vr;let im=im0;if(f>1)im=300+(im0-300)/(1+.7*(f-1));else if(f<.6)im=300+(im0-300)*(.55+.75*f);
    const inter=y=>300+(im-300)*clamp((y-40)/380,0,1);
    const tal=y=>L.loop?inter(y):(y<200?Math.max(100,inter(y)-200-(y<100?40:0)):inter(y)-100);
    const cd=y=>L.adh==='absent'?Math.max(70,100-(y-40)/380*25):L.loop?inter(y)*(L.adh==='max'?1:.9):L.adh==='max'?Math.max(150,inter(y)):Math.max(150,300+(inter(y)-300)*.45+(y<120?-150:0));
    O={im,inter,tal,cd,urine:Math.round(cd(420))};};
  const draw=()=>{comp();let s=`<defs><linearGradient id="ccG" x1="0" y1="40" x2="0" y2="420" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${osmColor(300)}"/><stop offset="1" stop-color="${osmColor(O.im)}"/></linearGradient></defs>
    <rect x="0" y="0" width="600" height="40" fill="${osmColor(290)}"/><rect x="0" y="40" width="600" height="400" fill="url(#ccG)"/><line x1="0" y1="200" x2="600" y2="200" stroke="var(--ink3)" stroke-dasharray="3 5"/>
    <text class="cellT" x="590" y="34" text-anchor="end">cortex</text><text class="cellT" x="590" y="194" text-anchor="end">outer medulla</text><text class="cellT" x="590" y="216" text-anchor="end">inner medulla</text>
    <path d="M120 20 L120 400 C120 428, 180 428, 180 400 L180 200" fill="none" stroke="#86BBD6" stroke-width="8"/><path d="M180 200 L180 20" stroke="${L.loop?'#B9A8D3':'#8C67BE'}" stroke-width="13"/>
    <path d="M300 20 L300 404 C300 418, 340 418, 340 404 L340 20" fill="none" stroke="#C8434F" stroke-width="7" opacity=".85"/><path d="M340 404 L340 20" stroke="#6C7FBF" stroke-width="7"/>
    <path d="M480 14 L480 426" stroke="#E0B13A" stroke-width="12"/>
    <text class="cellH" x="120" y="14" text-anchor="middle">tDL</text><text class="cellH" x="180" y="14" text-anchor="middle">TAL</text><text class="cellH" x="320" y="12" text-anchor="middle" style="font-size:11.5px">vasa recta</text><text class="cellH" x="480" y="10" text-anchor="middle" style="font-size:11.5px">collecting duct</text>
    <text class="cellT" x="188" y="318">thin</text><text class="cellT" x="188" y="330">ascending</text>`;
    const chip=(x,y,v,c)=>{const t=String(Math.round(v));return`<g transform="translate(${x} ${y})"><rect x="-17" y="-8" width="34" height="16" rx="8" fill="var(--panel)" stroke="${c||'var(--line)'}"/><text class="chipT" text-anchor="middle" y="3.5">${t}</text></g>`;};
    for(const y of lev){const iv=O.inter(y);s+=chip(120,y,iv,'#86BBD6')+chip(180,y,O.tal(y),'#8C67BE')+chip(242,y,iv)+chip(300,y,iv-15,'#C8434F')+chip(340,y,iv+15,'#6C7FBF')+chip(412,y,iv)+chip(480,y,O.cd(y),'#E0B13A');}
    s+=`<text class="cellT" x="242" y="30" text-anchor="middle">interstitium</text><text class="cellT" x="412" y="30" text-anchor="middle">interstitium</text><text class="cellT" x="480" y="438" text-anchor="middle" style="font-weight:700;fill:var(--ink)">urine ≈${O.urine}</text>`;
    svg.innerHTML=s;$('#o-vr',body).textContent='×'+L.vr.toFixed(2);
    $('#ccOut',body).innerHTML=`<div class="outs"><div>Papillary interstitium<b>${Math.round(O.im)}</b>mOsm/kg</div><div>Fluid leaving TAL<b>${Math.round(O.tal(60))}</b>mOsm/kg</div><div>Urine<b>${O.urine}</b>mOsm/kg</div><div>Urine volume<b>${L.adh==='absent'?'↑↑':L.loop?'↑':L.adh==='max'?'↓↓':'↔'}</b></div></div>
     <p>${L.loop?'With NKCC2 blocked the TAL can neither dilute nor load the interstitium: the gradient washes out and urine approaches isosthenuria regardless of AVP.':L.adh==='absent'?'Without AVP the collecting duct stays water-impermeable: the ≈100 mOsm/kg fluid from the diluting segments is excreted and less urea recycling lowers the inner-medullary gradient.':L.adh==='max'?'Maximal AVP: collecting-duct fluid equilibrates with the interstitium at every level, so urine reaches ≈1200 mOsm/kg.':'Moderate AVP: partial equilibration in the collecting duct.'}${L.vr>1.4?' High vasa recta flow is washing solute out of the medulla.':L.vr<.6?' Very low vasa recta flow: TAL hypoxia blunts NaCl transport and the gradient falls.':''}</p>`;};
  draw();
  $$('[data-adh]',body).forEach(b=>b.onclick=()=>{L.adh=b.dataset.adh;$$('[data-adh]',body).forEach(x=>x.classList.toggle('on',x===b));draw();});
  $('#ccLoop',body).onchange=e=>{L.loop=e.target.checked;draw();};$('#ccVr',body).oninput=e=>{L.vr=+e.target.value;draw();};
  const acc={};const em=(k,rate,dt,fn)=>{acc[k]=(acc[k]||0)+dt*rate;while(acc[k]>=1){acc[k]--;fn();}};
  DV.step=dt=>{const ry=()=>rnd(50,395);
    em('tdlw',3,dt,()=>{const y=ry();eng.emit('H2O',[[120,y],[150+rnd(0,25),y+rnd(-8,8)]],40);});
    if(!L.loop)em('tal',3.4,dt,()=>{const y=rnd(30,195);eng.emit(Math.random()<.5?'Na':'Cl',[[180,y],[212+rnd(0,25),y+rnd(-8,8)]],40);});
    em('tat',1.2,dt,()=>{const y=rnd(205,395);eng.emit(Math.random()<.5?'Na':'Cl',[[180,y],[210+rnd(0,20),y]],35);});
    const cdw=L.adh==='absent'?0:L.adh==='max'?3:1.6;em('cdw',cdw,dt,()=>{const y=ry();eng.emit('H2O',[[480,y],[452-rnd(0,25),y+rnd(-8,8)]],40);});
    if(L.adh!=='absent')em('urea',L.adh==='max'?2:1,dt,()=>{const y=rnd(220,410);eng.emit('Urea',[[480,y],[445-rnd(0,20),y]],35);});
    em('dvr',1.6*L.vr,dt,()=>{const y=ry();if(Math.random()<.5)eng.emit('H2O',[[300,y],[272,y]],30);else eng.emit('Na',[[270,y],[300,y]],30);});
    em('avr',1.6*L.vr,dt,()=>{const y=ry();if(Math.random()<.5)eng.emit('H2O',[[372,y],[340,y]],30);else eng.emit('Na',[[340,y],[372,y]],30);});
    em('rbc',2.2*L.vr,dt,()=>eng.emit('RBC',[[300,20],[300,404],[320,416],[340,404],[340,20]],70*L.vr,1.1));
    em('flow',2,dt,()=>eng.emit('Na',[[120,22],[120,400],[150,424],[180,400],[180,22]],90,.9));
    em('cdf',1.2,dt,()=>eng.emit('H2O',[[480,16],[480,430]],70,.9));
    eng.step(dt);};
  DV.draw=()=>{layer.clear();eng.draw();};bindCommon(body);
};

/* ============================== thick ascending limb ============================== */
VIEWS.tal=(body)=>{
  body.innerHTML=`${scnBox('tal')}${cellStageHTML('tal')}
  <h3>Mechanism</h3><ol><li>NKCC2 moves Na⁺, K⁺ and 2 Cl⁻ from lumen into the cell.</li><li>ROMK returns K⁺ to the lumen, creating a lumen-positive voltage.</li><li>The voltage drives paracellular Ca²⁺ and Mg²⁺ reabsorption.</li><li>Because the TAL is water-impermeable, removing NaCl dilutes tubular fluid (≈100 mOsm/kg leaving the segment) and loads the medullary interstitium.</li></ol>
  ${renderPW('tal','Thick ascending limb transport logic')}
  <div class="info"><h4>Pattern recognition</h4>Loop diuretic or NKCC2/ROMK defect → salt wasting, hypokalemic metabolic alkalosis, increased renin and aldosterone, and increased urinary Ca²⁺. Bartter syndrome resembles chronic loop-diuretic use.<div class="btnrow"><button data-scn="loop">Simulate loop diuretic</button><button data-scn="bartter">Simulate Bartter syndrome</button></div></div>
  <table class="tbl"><tr><th>Bartter type</th><th>Gene / protein</th><th>Notes</th></tr><tr><td>I</td><td>SLC12A1 / NKCC2</td><td>Antenatal: polyhydramnios, prematurity, nephrocalcinosis</td></tr><tr><td>II</td><td>KCNJ1 / ROMK</td><td>Antenatal; transient neonatal hyperkalemia (ROMK also secretes K⁺ in the CCD)</td></tr>
  <tr><td>III</td><td>CLCNKB / ClC-Kb</td><td>“Classic”, childhood; may overlap with Gitelman (ClC-Kb also in DCT)</td></tr><tr><td>IV</td><td>BSND / barttin</td><td>With sensorineural deafness (barttin needed in the inner ear)</td></tr><tr><td>V</td><td>CASR gain of function</td><td>Hypocalcemia with hypercalciuria</td></tr></table>
  <h4>Why loop diuretics are powerful</h4><p>They act where ≈25% of filtered NaCl is reabsorbed, and the downstream segments can only partly compensate. They also wash out the medullary gradient (impaired concentrating ability), increase urinary Ca²⁺ (used in hypercalcemia) and Mg²⁺, and block the macula densa sensor, so renin rises.</p>`;
  mountCell('tal',body);bindCommon(body);
};

/* ============================== macula densa / JGA ============================== */
VIEWS.md=(body,tab)=>{
  if(tab==='path'){body.innerHTML=`${scnBox('md')}<h3>Tubuloglomerular feedback</h3>${renderPW('tgf','Tubuloglomerular feedback loop')}
    <p>TGF keeps the NaCl load reaching the distal nephron matched to its reabsorptive capacity. High NaCl uptake through NKCC2 in macula densa cells releases ATP, which is converted to adenosine; adenosine acts on A₁ receptors to constrict the afferent arteriole and suppress renin. SGLT2 inhibitors exploit this loop: more NaCl reaches the macula densa, the afferent arteriole constricts, and intraglomerular pressure falls.</p>
    <h3>Renin–angiotensin–aldosterone system</h3>${renderPW('raas','Renin release and the renin–angiotensin–aldosterone cascade')}
    <p>Three inputs stimulate renin release from granular (juxtaglomerular) cells in the afferent arteriole wall: falling afferent pressure (intrarenal baroreceptor), falling NaCl delivery to the macula densa (via COX-2/PGE₂ and nNOS/NO) and renal sympathetic β₁ stimulation. Ang II acts at AT₁ (Gq → IP₃/Ca²⁺): moderate levels preferentially constrict the efferent arteriole, stimulate PCT NHE3, release aldosterone and AVP, and stimulate thirst; it also feeds back to inhibit renin.</p>`;bindCommon(body);return;}
  const sid=state.scn.id;const J={nacl:{sglt2i:1.5,hemorrhage:.5,nsaid:.7,acei:.7,liddle:1.2,hyperaldo:1.2}[sid]||1,loop:sid==='loop'||sid==='bartter',nsaid:sid==='nsaid',beta:sid==='hemorrhage'};
  body.innerHTML=`${scnBox('md')}<div class="cellstage" id="jgaStage"><svg viewBox="0 0 600 380" role="img" aria-label="Juxtaglomerular apparatus: macula densa, mesangial cells, granular cells and afferent arteriole"></svg><canvas aria-hidden="true"></canvas></div>
  <div class="ctrls"><label>NaCl delivery to the macula densa<output id="o-na"></output><input type="range" id="jNa" min="0.3" max="1.8" step="0.02" value="${J.nacl}"></label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="jLoop" ${J.loop?'checked':''}> Loop diuretic (blocks MD NKCC2)</label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="jNs" ${J.nsaid?'checked':''}> NSAID (blocks COX-2)</label>
  <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="jB" ${J.beta?'checked':''}> Sympathetic β₁ activation</label></div>
  <div id="jOut"></div>
  <h3>Juxtaglomerular apparatus</h3><p>Where the thick ascending limb returns to touch its own glomerulus, three cell types meet: the <strong>macula densa</strong> (specialized TAL cells that sense luminal NaCl via NKCC2), <strong>extraglomerular mesangial cells</strong> (relay signals), and <strong>granular cells</strong> in the afferent arteriole wall (store and release renin).</p>
  <table class="tbl"><tr><th>Signal</th><th>High NaCl delivery</th><th>Low NaCl delivery (hemorrhage, volume loss, ↑ upstream reabsorption)</th></tr>
  <tr><td>Macula densa messenger</td><td>ATP released → adenosine</td><td>↓ ATP/adenosine; ↑ COX-2 PGE₂ and nNOS NO</td></tr><tr><td>Afferent arteriole</td><td>A₁ receptors: constriction → ↓ RBF, ↓ GFR</td><td>Less constrictor tone → dilation supports P<sub>GC</sub> and GFR</td></tr>
  <tr><td>Granular cells</td><td>Renin release ↓</td><td>PGE₂ stimulates renin release → RAAS activation</td></tr></table>`;
  const stage=$('#jgaStage',body),svg=$('svg',stage);const layer=new Layer(svg,$('canvas',stage),600,380);DV.layer=layer;const eng=makeEngine(layer);
  let M;const comp=()=>{const sensed=J.loop?0.15:J.nacl;const ado=clamp((sensed-.3)*.6,0,1.2);const pge=J.nsaid?0:clamp((1.4-sensed)*.6,0,1);const ren=clamp(.1+1.1*pge-.35*ado+(J.beta?.4:0),.02,1.6);const tone=clamp(1+.9*(ado-.42)-.6*(pge-.24),.5,1.8);M={sensed,ado,pge,ren,tone};};
  const N={ado:.42,pge:.24,ren:.217,tone:1};
  const draw=()=>{comp();const w=clamp(26*Math.pow(M.tone,-.6),10,40);
    let s=`<rect x="0" y="40" width="600" height="52" fill="var(--lumen)"/>`;
    for(let x=0;x<600;x+=28)s+=`<rect x="${x+1}" y="24" width="26" height="16" rx="5" fill="#B9A3D9" stroke="#7E62A8"/>`;
    for(let x=0;x<600;x+=28){if(x>=210&&x<392)continue;s+=`<rect x="${x+1}" y="92" width="26" height="16" rx="5" fill="#B9A3D9" stroke="#7E62A8"/>`;}
    for(let x=212;x<392;x+=15)s+=`<rect x="${x}" y="92" width="14" height="48" rx="4" fill="#8DD3A6" stroke="#3E9A5E"/><ellipse cx="${x+7}" cy="${108}" rx="4" ry="6" fill="#3E7F55"/>`;
    s+=`<text class="cellH" x="12" y="18">Thick ascending limb</text><text class="cellH" x="300" y="18" text-anchor="middle">Macula densa</text><text class="cellH" x="588" y="18" text-anchor="end">Early DCT</text><text class="cellT" x="300" y="72" text-anchor="middle">tubular fluid NaCl ×${J.nacl.toFixed(2)} ${J.loop?'(sensing blocked)':''}</text>`;
    for(const [cx,cy] of [[262,168],[292,160],[322,166],[350,172],[278,190],[310,188],[338,194]])s+=`<ellipse cx="${cx}" cy="${cy}" rx="16" ry="10" fill="#9ED7B4" stroke="#4B9E6B"/>`;
    s+=`<text class="cellT" x="380" y="186">extraglomerular mesangium</text>`;
    s+=`<circle cx="305" cy="345" r="62" fill="var(--lumen)" stroke="#C59A45" stroke-width="4"/>${[[285,330,16],[318,336,15],[300,358,15],[330,360,12],[276,356,11]].map(c=>`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" fill="#D0454F" opacity=".85"/>`).join('')}<text class="cellT" x="305" y="402" text-anchor="middle">glomerulus</text>`;
    s+=`<path id="jAff" d="M 0 252 C 120 252, 200 236, 272 300" fill="none" stroke="#C8434F" stroke-width="${w+8}" stroke-linecap="round"/><path d="M 0 252 C 120 252, 200 236, 272 300" fill="none" stroke="#EE9AA0" stroke-width="${w}" stroke-linecap="round"/>`;
    s+=`<path id="jEff" d="M 340 300 C 410 238, 500 245, 600 245" fill="none" stroke="#C8434F" stroke-width="22" stroke-linecap="round"/><path d="M 340 300 C 410 238, 500 245, 600 245" fill="none" stroke="#EE9AA0" stroke-width="15" stroke-linecap="round"/>`;
    for(const x of [150,176,202,228]){const y=x<200?246-(x-150)*.12:240;s+=`<rect x="${x}" y="${y-w/2-16}" width="22" height="14" rx="5" fill="#F2C7A6" stroke="#B5743F"/>${[0,1,2].map(i=>`<circle cx="${x+5+i*6}" cy="${y-w/2-9}" r="2.2" fill="#B3242F" opacity="${.35+M.ren*.6}"/>`).join('')}`;}
    s+=`<text class="cellT" x="40" y="${232-w/2}">granular (renin) cells</text><text class="cellH" x="20" y="284">Afferent arteriole</text><text class="cellH" x="590" y="276" text-anchor="end">Efferent arteriole</text>`;
    s+=`<text class="cellT" x="40" y="300">A₁ receptors: ${M.ado>N.ado+.05?'activated → constriction':M.ado<N.ado-.05?'quiet → dilation':'baseline tone'}</text>`;
    svg.innerHTML=s;$('#o-na',body).textContent='×'+J.nacl.toFixed(2);
    const a=(v,v0)=>arr(v,v0,.08);
    $('#jOut',body).innerHTML=`<div class="outs"><div>NaCl sensed ${a(M.sensed,1)}<b>×${M.sensed.toFixed(2)}</b></div><div>ATP / adenosine ${a(M.ado,N.ado)}<b>${(M.ado/N.ado).toFixed(2)}</b>× normal</div><div>PGE₂ / NO ${a(M.pge,N.pge)}<b>${(M.pge/N.pge).toFixed(2)}</b>× normal</div>
      <div>Renin release ${a(M.ren,N.ren)}<b>${(M.ren/N.ren).toFixed(2)}</b>× normal</div><div>Afferent tone ${a(M.tone,1)}<b>×${M.tone.toFixed(2)}</b></div><div>GFR (TGF effect) ${a(1/M.tone,1)}<b>${M.tone>1.04?'↓':M.tone<.96?'↑':'↔'}</b></div></div>
      <div class="flow">${J.loop?'<span class="n">NKCC2 blocked</span><span class="a">→</span><span class="n">MD senses “low NaCl” regardless of delivery</span><span class="a">→</span>':`<span class="n">NaCl delivery ×${J.nacl.toFixed(2)}</span><span class="a">→</span>`}
      ${M.sensed>1.05?'<span class="n">↑ NKCC2 uptake</span><span class="a">→</span><span class="n">ATP → adenosine ↑</span><span class="a">→</span><span class="n">A₁ afferent constriction, renin ↓</span><span class="a">→</span><span class="n">GFR back down (negative feedback)</span>':
       M.sensed<.95?`<span class="n">↓ adenosine</span><span class="a">+</span><span class="n">${J.nsaid?'PGE₂ blocked by NSAID':'↑ PGE₂ / NO'}</span><span class="a">→</span><span class="n">${J.nsaid?'afferent dilation and renin release blunted':'afferent dilation and renin release'}</span><span class="a">→</span><span class="n">${J.nsaid?'GFR and RAAS support lost':'RAAS activation; GFR supported'}</span>`:'<span class="n">Baseline signaling</span>'}
      ${J.beta?'<span class="a">+</span><span class="n">β₁ directly stimulates renin</span>':''}</div>`;};
  draw();$('#jNa',body).oninput=e=>{J.nacl=+e.target.value;draw();};$('#jLoop',body).onchange=e=>{J.loop=e.target.checked;draw();};$('#jNs',body).onchange=e=>{J.nsaid=e.target.checked;draw();};$('#jB',body).onchange=e=>{J.beta=e.target.checked;draw();};
  const acc={};const em=(k,rate,dt,fn)=>{acc[k]=(acc[k]||0)+dt*rate;while(acc[k]>=1){acc[k]--;fn();}};
  DV.step=dt=>{em('lum',7*J.nacl,dt,()=>eng.emit(Math.random()<.5?'Na':'Cl',[[0,rnd(48,84)],[600,rnd(48,84)]],110));
    if(!J.loop)em('nk',3.5*M.sensed,dt,()=>{const x=rnd(220,385);eng.emit(Math.random()<.5?'Na':'Cl',[[x,62],[x,118]],45);});
    em('ado',6*M.ado,dt,()=>eng.emit('ATP',[[rnd(240,370),140],[rnd(270,340),178],[rnd(160,250),246]],60));
    em('pge',6*M.pge,dt,()=>eng.emit('PGE',[[rnd(240,370),140],[rnd(250,300),190],[rnd(155,245),228]],60));

};

/* ============================== early DCT ============================== */
VIEWS.dct=(body)=>{
  body.innerHTML=`${scnBox('dct')}${cellStageHTML('dct')}
  <h3>Early DCT pattern</h3><ol><li>NCC reabsorbs NaCl; the segment stays water-impermeable and continues to dilute tubular fluid.</li><li>PTH increases transcellular Ca²⁺ reabsorption through TRPV5, calbindin and basolateral Na⁺/Ca²⁺ exchange (NCX1) and PMCA.</li><li>TRPM6 fine-tunes Mg²⁺ reabsorption.</li></ol>
  ${renderPW('dct','Early DCT: NCC, calcium and magnesium handling')}
  <div class="info"><h4>Pattern recognition</h4>Thiazide or NCC defect → hypokalemic metabolic alkalosis with LOW urinary Ca²⁺. Gitelman syndrome resembles chronic thiazide use and commonly includes hypomagnesemia.<div class="btnrow"><button data-scn="thiazide">Simulate thiazide</button><button data-scn="gitelman">Simulate Gitelman</button><button data-scn="pth">Simulate ↑ PTH</button></div></div>
  <table class="tbl"><tr><th></th><th>Bartter (TAL)</th><th>Gitelman (DCT)</th></tr><tr><td>Mimics</td><td>Loop diuretic</td><td>Thiazide</td></tr><tr><td>Urinary Ca²⁺</td><td>↑ (nephrocalcinosis)</td><td>↓</td></tr><tr><td>Plasma Mg²⁺</td><td>Normal or mildly ↓</td><td>↓ (often prominent)</td></tr>
  <tr><td>Concentrating ability</td><td>Impaired (gradient lost)</td><td>Preserved</td></tr><tr><td>Onset</td><td>Antenatal to childhood</td><td>Adolescence to adulthood</td></tr><tr><td>Shared</td><td colspan="2">Salt wasting, hypokalemic metabolic alkalosis, ↑ renin and aldosterone, normal or low BP</td></tr></table>
  <p class="note">Thiazide uses linked to physiology: hypertension, calcium nephrolithiasis (hypocalciuria), and paradoxically nephrogenic DI (mild volume contraction increases proximal reabsorption, so less fluid reaches the collecting duct). Thiazides impair diluting ability, so hyponatremia is a classic adverse effect.</p>`;
  mountCell('dct',body);bindCommon(body);
};

/* ============================== collecting duct ============================== */
VIEWS.cd=(body,tab)=>{
  const txt={
   pc:`<h3>Principal cell: Na⁺ in, K⁺ out</h3><p>Aldosterone-sensitive Na⁺ reabsorption here (≈2–3% of the filtered load) is electrogenic. ENaC Na⁺ entry makes the lumen negative, which increases the electrical drive for K⁺ exit through ROMK and BK and for H⁺ secretion by α-intercalated cells. Anything that delivers more Na⁺ and flow to this segment (loop or thiazide diuretics, osmotic diuresis) or raises aldosterone increases K⁺ and H⁺ loss; anything that blocks ENaC or the MR is K⁺-sparing.</p>
     ${renderPW('pc','Principal cell regulation: aldosterone and AVP')}
     <table class="tbl"><tr><th>Site</th><th>Drug or disorder</th><th>Pattern</th><th></th></tr><tr><td>ENaC</td><td>Amiloride, triamterene</td><td>K⁺-sparing; reduces lumen-negative potential</td><td><button data-scn="amiloride">Simulate</button></td></tr>
     <tr><td>ENaC gain of function</td><td>Liddle syndrome</td><td>Hypertension, hypokalemic alkalosis, low renin and aldosterone</td><td><button data-scn="liddle">Simulate</button></td></tr><tr><td>Mineralocorticoid receptor</td><td>Spironolactone, eplerenone</td><td>K⁺-sparing; blocks aldosterone action</td><td><button data-scn="spiro">Simulate</button></td></tr>
     <tr><td>Aldosterone excess</td><td>Primary hyperaldosteronism</td><td>Hypertension, hypokalemic alkalosis, low renin, high aldosterone</td><td><button data-scn="hyperaldo">Simulate</button></td></tr><tr><td>AQP2 / V2</td><td>Diabetes insipidus</td><td>Large volumes of dilute urine</td><td><button data-scn="di">Simulate</button></td></tr></table>`,
   aic:`<h3>α-intercalated cell: acid secretion</h3><p>Secretes H⁺ through the apical H⁺-ATPase and H⁺/K⁺-ATPase and returns one new HCO₃⁻ to blood for each H⁺ via basolateral AE1. Secreted H⁺ is carried away as titratable acid and NH₄⁺, which is how the kidney excretes the daily fixed-acid load. Aldosterone, the lumen-negative voltage from neighboring principal cells, acidosis and hypokalemia all stimulate it, which is why volume contraction with high aldosterone and K⁺ depletion sustain metabolic alkalosis.</p><p class="note">Defects in the H⁺-ATPase or AE1 cause distal (type 1) renal tubular acidosis: urine pH stays above ≈5.5 despite acidemia.</p>`,
   bic:`<h3>β-intercalated cell: base secretion</h3><p>The mirror image of the α cell: apical pendrin (Cl⁻/HCO₃⁻ exchange) secretes HCO₃⁻ and reabsorbs Cl⁻, while the basolateral H⁺-ATPase returns H⁺ to blood. It is upregulated during metabolic alkalosis and corrects it, provided Cl⁻ is available (one reason chloride-responsive alkalosis needs Cl⁻ repletion).</p>`,
   imcd:`<h3>Inner medullary collecting duct: final say</h3><p>AVP acts on V2 receptors (Gs → cAMP → PKA) to insert AQP2 and to activate the urea transporters UT-A1 and UT-A3. Water leaves into the ≈1200 mOsm/kg papillary interstitium; urea, concentrated upstream in urea-impermeable segments, diffuses out and is recycled into the thin limbs. Final urine ranges from ≈50 mOsm/kg (no AVP) to ≈1200 mOsm/kg (maximal AVP). Some ENaC activity provides the last Na⁺ adjustment.</p>
     <div class="btnrow"><button data-scn="di">Simulate diabetes insipidus</button><button data-scn="dehyd">Simulate water deprivation</button></div>
     <table class="tbl"><tr><th>Region</th><th>Apical transporter / channel</th><th>Water</th><th>Key regulation</th></tr><tr><td>Late DCT / CNT / CCD principal cell</td><td>ENaC; ROMK/BK</td><td>Variable with AVP</td><td>Aldosterone ↑ ENaC and Na⁺/K⁺-ATPase; Na⁺ reabsorption favors K⁺ secretion</td></tr>
     <tr><td>α-intercalated</td><td>H⁺-ATPase; H⁺/K⁺-ATPase</td><td>Low</td><td>Secretes H⁺; returns HCO₃⁻ to blood</td></tr><tr><td>β-intercalated</td><td>Pendrin</td><td>Low</td><td>Secretes HCO₃⁻</td></tr><tr><td>IMCD</td><td>ENaC; UT-A1/UT-A3 with AVP</td><td>Variable with AVP</td><td>Final urine composition; urea recycling</td></tr></table>`};
  body.innerHTML=`${scnBox('cd')}${cellStageHTML(tab)}${txt[tab]}`;mountCell(tab,body);bindCommon(body);
};

/* ============================== peritubular capillaries ============================== */
VIEWS.ptc=(body)=>{
  const H=state.H,Pi=6,PIi=15;const net=(H.piOut-PIi)-(H.Ppc-Pi);const net0=(H0.piOut-PIi)-(H0.Ppc-Pi);
  const bars=[['P_c (capillary hydrostatic)',H.Ppc,'var(--art)','out'],['π_c (capillary oncotic)',H.piOut,'#8A5BC8','in'],['P_i (interstitial hydrostatic)',Pi,'var(--ven)','in'],['π_i (interstitial oncotic)',PIi,'var(--ink3)','out']];
  let s='';bars.forEach(([n,v,c,dir],i)=>{const y=30+i*48;s+=`<text class="chT" x="10" y="${y+14}" style="fill:var(--ink)">${esc(n)}</text><rect x="230" y="${y}" width="${v*6}" height="22" rx="4" fill="${c}" opacity=".85"/><text class="chT" x="${236+v*6}" y="${y+15}">${fmt(v)} mmHg (${dir==='in'?'favors uptake':'opposes uptake'})</text>`;});
  body.innerHTML=`${scnBox('ptc')}<svg class="chart" viewBox="0 0 600 230" role="img" aria-label="Starling forces in the peritubular capillary">${s}</svg>
  <div class="outs"><div>Net reabsorptive pressure ${arr(net,net0,.05)}<b>${fmt(net)}</b>mmHg</div><div>Filtration fraction<b>${fmt(H.FF*100,1)}%</b></div><div>Efferent ×<b>${(H.Re/RE0).toFixed(2)}</b></div></div>
  <div class="eq">Net uptake force = (π<sub>c</sub> − π<sub>i</sub>) − (P<sub>c</sub> − P<sub>i</sub>)</div>
  <p>After filtration, blood entering the peritubular capillaries has lost ≈20% of its plasma water but none of its protein, so π<sub>c</sub> is high (≈35 mmHg); the efferent arteriole’s resistance makes P<sub>c</sub> low. Both favor uptake of the fluid the tubule reabsorbs into the interstitium. These values follow the glomerular model: <button data-goview="glom">change arteriolar tone</button> and return here.</p>
  <h3>Glomerulotubular balance</h3><p>When FF rises (efferent constriction with Ang II, volume depletion), π<sub>c</sub> rises and P<sub>c</sub> falls, so proximal reabsorption rises with filtration. This keeps a roughly constant fraction of the filtered load reabsorbed in the PCT and helps conserve volume. When FF falls (volume expansion, efferent dilation), uptake falls and more Na⁺ reaches the distal nephron.</p>`;
  bindCommon(body);
};

/* ============================== scenario control and init ============================== */
function targetSeg(s){if(!s.target)return null;if(s.target==='cd')return s.tab==='imcd'?'imcd':s.tab==='aic'?'omcd':'ccd';if(s.target==='loop')return'tdl';return VIEWDEF[s.target].segs[0];}
function setScenario(id){
  const s=SCNMAP[id];if(!s)return;state.scn=s;state.hp={...BASEHEMO,...(s.hemo||{})};state.H=hemo(state.hp);computeModel();
  OV.parts=OV.parts.filter(p=>p.mode!=='lum');$('#scn').value=id;updateOverviewStatic();renderReadout();
  if(s.target){state.selSeg=targetSeg(s);openView(s.target,s.tab);}else renderDetail();markSelected();
}
function init(){
  const sel=$('#scn');const groups={};SCN.forEach(s=>(groups[s.g]=groups[s.g]||[]).push(s));
  sel.innerHTML=Object.entries(groups).map(([g,l])=>`<optgroup label="${esc(g)}">${l.map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join('')}</optgroup>`).join('');
  sel.onchange=()=>setScenario(sel.value);$('#resetBtn').onclick=()=>setScenario('normal');
  const pb=$('#playBtn');const syncPlay=()=>{pb.textContent=state.paused?'Play':'Pause';pb.setAttribute('aria-pressed',String(!state.paused));};syncPlay();pb.onclick=()=>{state.paused=!state.paused;syncPlay();};
  $('#speed').oninput=e=>state.speed=+e.target.value;
  $('#legend').innerHTML=OV_IONS.map(k=>`<button data-ion="${k}" aria-pressed="true" title="Show or hide ${esc(IONS[k].n)}">${ionIcon(k)}${esc(IONS[k].n.replace(' (PAH, drugs)',''))}</button>`).join('')+`<span class="note" style="align-self:center;margin-left:4px">RBCs in red</span>`;
  $$('#legend [data-ion]').forEach(b=>b.onclick=()=>{const k=b.dataset.ion;if(state.vis.has(k))state.vis.delete(k);else state.vis.add(k);b.setAttribute('aria-pressed',String(state.vis.has(k)));});
  computeModel();buildOverview();updateOverviewStatic();renderReadout();renderDetail();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{updateOverviewStatic();if(state.view==='loop')renderDetail();});
  let last=performance.now();
  const frame=now=>{const dt=Math.min(.05,(now-last)/1000);last=now;try{if(!state.paused){const d=dt*state.speed;ovStep(d);if(DV.step)DV.step(d);}ovDraw();if(DV.draw)DV.draw();}catch(err){console.error(err);}requestAnimationFrame(frame);};
  requestAnimationFrame(frame);
}
init();
</script>
</body>
